name: Accessibility problem
description: Report a keyboard, screen-reader, contrast or responsive-layout issue.
title: "[accessibility] "
labels: [accessibility]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Keyboard, Screen reader, Contrast, Zoom or reflow, Motion, Other]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Steps, expected result and observed result
    validations:
      required: true
